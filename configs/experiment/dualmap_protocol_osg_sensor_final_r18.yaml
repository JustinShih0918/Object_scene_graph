# @package _global_
#
# The sensor-only configuration on the ORIGINAL 0.18 m body, to separate the
# embodiment from the fixes.
#
# `sensor_r10` changed the mover, the closing walk and the radius at once, and
# the radius cuts both ways: 0.10 frees 6 of the 15 objects with no navmesh
# point inside the 1 m rule, but it also shrinks costmap inflation, which is
# what let the viewpoint planner hand back poses the agent could not stand in.
# Now that clearance is a constraint rather than a preference, the inflation
# argument should be gone and only the reachability gain should remain -- so
# this arm is expected to score slightly LOWER than `_sensor_final`, by about
# the six trials the smaller body buys.
#
# If it scores level or higher, the 0.10 body was never the reason and we can
# report the standard 0.18 embodiment, which is the cleaner claim.

defaults:
  - dualmap_protocol_osg_sensor_final

agent:
  agent_radius: 0.18
  approach_close_clearance_m: 0.23   # body + one cell, as 0.15 is for 0.10

verification:
  viewpoint_min_clearance_m: 0.23

# @package _global_
#
# The restrike guard plus a third reachability answer: the nearest free cell
# to the object, which is where the approach drives when no ring pose exists.
# With the guard alone a true track survives its "unreachable" strikes but is
# still never committed, because the answer never changes from the same pose.
defaults:
  - dualmap_protocol_osg_look_flat_anchor_v2_restrike

agent:
  reachable_via_nearest_free: true

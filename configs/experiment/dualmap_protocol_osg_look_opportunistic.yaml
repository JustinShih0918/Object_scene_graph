# @package _global_
#
# Tight-ring baseline plus the OPPORTUNISTIC close look only
# (docs/SR_PROPOSAL_CLOSE_LOOK.md, arm 3). A keyframe in EXPLORE or
# GOTO_FRONTIER that shows an affording container within 2.5 m, not yet
# inspected, earns a detour to a facing pose on the 1.5 m ring; the pursuit
# resumes afterwards. Passive glances beyond 2.5 m no longer retire belief --
# the detector's recall out there is 0.28, and a surface passed at 3.5 m was
# being credited as 80% searched.
#
#   python scripts/run_eval.py +experiment=dualmap_protocol_osg_look_opportunistic \
#     'dualmap.scenes=[00829-QaLdnwvtxbs]' \
#     ycb.map_in=outputs/maps_v5/00829-QaLdnwvtxbs \
#     output_dir=outputs/osg_closelook/opportunistic/00829-QaLdnwvtxbs
defaults:
  - dualmap_protocol_osg_tightring

agent:
  close_look_opportunistic: true

exploration:
  search_glance_range_m: 2.5

eval:
  gt_dump_dir: ""

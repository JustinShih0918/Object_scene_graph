# @package _global_
#
# Fix 3 of 4: sweep the viewpoint clearance threshold.
#
# At 0.25 m the strict ring search failed on most approaches
# (`approach_viewpoint_none` 4 -> 45) and the relaxed fallback carried the arm.
# The fallback enforces the same clearance so the goals stay standable, but a
# threshold that relaxes the ladder on nearly every approach was a guess, not a
# measurement. This arm is 0.20 m; read `approach_viewpoint_none` beside SR.

defaults:
  - dualmap_protocol_osg_sensor_r10_best

verification:
  viewpoint_min_clearance_m: 0.20

# @package _global_
#
# On top of v2_island: after a failed stale stop, the next attempt opens
# with a close look at the stale track's container from a pose at least a
# metre from the one just stood on. The object is most likely still on that
# surface; the remaining in-anchor failures under the island fix stop at
# 1.0-1.9 m of it.
defaults:
  - dualmap_protocol_osg_look_flat_anchor_v2_island

verification:
  relook_after_stale_stop: true

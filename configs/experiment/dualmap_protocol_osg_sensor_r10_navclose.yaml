# @package _global_
#
# Fix 4 of 4: every sensor-side fix PLUS the navmesh closing walk.
#
# Not a shippable sensor-only arm. Its job is to price the privilege: the gap
# between this and `_costclose` is what the ground-truth mesh is actually worth
# once the agent's own map is being used properly.

defaults:
  - dualmap_protocol_osg_sensor_r10_best

agent:
  approach_close_last_metre_m: 0.8
  approach_close_source: navmesh

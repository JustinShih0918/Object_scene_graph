# @package _global_
#
# The S71 arm on MP3D ObjectNav instead of HM3D.
#
#   python scripts/download_mp3d.py --episodes-only          # public
#   python scripts/download_mp3d.py --mp-script download_mp.py   # licensed scenes
#   bash scripts/serve_perception.sh
#   python scripts/run_eval.py +experiment=ascentnav_mp3d
#
# WHAT CHANGES, AND THE ONE THING THAT DOES NOT TRANSFER.
# The embodiment is identical (640x480, 79 deg, 0.88 m, 500 steps, the same
# PointNav mover), so the agent, maps and stair machinery carry over unchanged.
# The goal set does not: MP3D asks for 21 categories and closed-set COCO can
# name 8 of them (chair, table, sofa, bed, plant, sink, toilet, tv_monitor).
# The other 13 -- picture, cabinet, cushion, chest_of_drawers, stool, towel,
# shower, bathtub, counter, fireplace, gym_equipment, seating, clothes -- are
# 13 of the 21 categories and 1115 of the 2195 val episodes (51%), and a
# COCO detector scores a structural zero on every one of them.
#
# So this preset runs the OPEN-VOCABULARY head (`detector: yoloe`), which is
# text-prompted and can be asked for any of the 21. That is a deviation from
# the HM3D arm, which is measured on D-FINE; it is not a tuning choice but the
# only configuration in which the split is answerable at all.
# `+experiment=ascentnav_mp3d_coco8` is the D-FINE counterpart, restricted to
# the 8 nameable categories, for a like-for-like comparison with the HM3D
# number.
#
# The ASCENT priors (knowledge graph, floor prior) cover the 6 HM3D categories
# only. The planner degrades to empty priors for the rest, which -- given S72,
# where the LLM touches 1.7% of frontier decisions -- costs close to nothing.

defaults:
  - ascentnav
  - override /detector: yoloe
  - override /eval: mp3d_val

detector:
  goal_vocabulary: mp3d
  conf: 0.3            # YOLOE's open-vocabulary score is not D-FINE's 0.8 scale
  strict: false        # YOLOE runs in-process; nothing to probe

exploration:
  value_strict: true   # BLIP-2 is still served, and a silent 0 still never STOPs

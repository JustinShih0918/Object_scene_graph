# @package _global_
#
# On top of the second-cut stale-anchor policy: a belief that can come back.
# On the in-anchor failures the true track is often "admitted, never
# committed": the ground-truth instrument saw the detector name it, but its
# presence had been driven to the negative clamp (-6 log-odds) by missed
# expectations while the agent walked around, and one sighting (+2.5) cannot
# lift it over the 0.45 bar. A clamp of -2 keeps disbelief recoverable by a
# single sighting, which is what "no state is absorbing" was meant to mean.
defaults:
  - dualmap_protocol_osg_look_flat_anchor_v2

scene_graph:
  presence:
    l_clamp: 2.0

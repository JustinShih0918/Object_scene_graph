# @package _global_
#
# Condition ZZ: the presence GATE, not the presence ranking.
#
# Z turned off `verification.rank_candidates_by_presence` and cost two episodes
# while rescuing none, because that flag only reorders the candidates that
# survive `ObjectLayer.candidates`. The exclusion happens earlier:
#
#     object_layer.py:290    if t.presence.p < min_presence: continue
#
# with `scene_graph.presence.min_presence = 0.45`. Of the eleven cross_anchor
# episodes in the Y control that saw the target and failed, NINE have a target
# track below that line -- p = 0.021, 0.057, 0.059, 0.103, 0.120, 0.255, 0.255,
# 0.319, 0.359 -- while carrying MORE evidence than the successes (median 14.7
# against 8.3) and more observations (28 against 15). They are not weak
# candidates. They are not candidates at all.
#
# The deadlock is the one this file already names three lines above, about the
# bbox gate: "a track seeded from a distant sighting can only grow its best box
# by being approached, and it can only be approached by being proposed". That
# gate was given `target_bypasses_bbox`. The presence gate has the same shape
# and no bypass:
#
#     seen at 2 m -> mapped -> agent walks past -> p decays from missed
#     expectations -> p < 0.45 -> excluded -> never approached -> never re-seen
#     close -> p never recovers -> 500 steps
#
# Prediction, stated before the run: the episodes that move are the nine below
# the line, and `cand_n_obs` goes from 0 to non-zero on them. If SR does not
# move but cand_n_obs does, the deadlock is real and the failure is downstream
# in the approach. If cand_n_obs stays 0, the gate was not what excluded them
# and the remaining suspects are min_score (0.3 against best_score, which for
# these tracks is often ~0.29) and max_identity_rejections (2).
#
# What this does NOT do: disable the presence filter. It still runs, still
# supplies the negative channel, still feeds absence. Only the hard candidacy
# cutoff is lifted, which is what `rank_candidates_by_presence` -- left ON here
# -- is for: presence should ORDER candidates, not silently delete them.
defaults:
  - ycb_dynamic_cross

scene_graph:
  presence:
    min_presence: 0.0

# @package _global_
#
# Search order, arm 2: a softer proximity, on top of the look before absence.
# exp(-d / 1.0) gives a surface 5.6 m from the stale position 0.4% of the peak;
# exp(-d / 4.0) gives it 25%, still ordered by distance (no floor, so far
# candidates do not tie). Offline this ranked the true cross-anchor surface
# worse (docs in core/config/exploration.py), but the offline proxy is
# scale-blind and the released benchmark's relocations are not semantic; the
# gate here is "own surface selected / arrived", online.
defaults:
  - dualmap_protocol_osg_look_inanchor

exploration:
  search_proximity_len_m: 4.0

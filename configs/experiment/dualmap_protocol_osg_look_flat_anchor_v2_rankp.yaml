# @package _global_
#
# On top of the second-cut stale-anchor policy: candidates ranked by detector
# confidence x presence again rather than by presence alone
# (`rank_candidates_by_presence` off), so a freshly seen true track can outrank
# a well-believed ghost. Memory note "presence may be suppressing found
# targets" asked for exactly this test.
defaults:
  - dualmap_protocol_osg_look_flat_anchor_v2

verification:
  rank_candidates_by_presence: false
